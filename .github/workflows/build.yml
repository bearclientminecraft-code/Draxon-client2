name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Loom 1.19 runs on Java 25; the mod itself is compiled for Java 21 (release = 21).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: draxon-reborn-jar
          path: build/libs/*.jar
          if-no-files-found: error
